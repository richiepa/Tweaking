<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweaking</title>
<meta name="description" content="Log how bad you're tweaking, 1 to 10. Your log never leaves this device.">
<meta name="theme-color" content="#171512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap">
  <header class="masthead">
    <h1>Tweaking</h1>
    <button id="profile-btn" class="avatar-btn" type="button" aria-label="Profiles">
      <img id="profile-avatar" alt="" hidden>
      <span id="profile-initial">?</span>
    </button>
  </header>

  <section id="profile-panel" class="card profile-panel" hidden aria-label="Profiles">
    <ul id="profile-list" class="profile-list"></ul>
    <div class="profile-add">
      <input type="text" id="new-profile-name" maxlength="30" placeholder="new profile name" autocomplete="off" aria-label="New profile name">
      <button id="new-profile-pic-btn" class="icon-btn pic-btn" type="button" aria-label="Choose a profile picture">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <button id="new-profile-add" class="primary small" type="button">Add</button>
    </div>
    <input type="file" id="new-profile-pic" accept="image/*" hidden>
  </section>

  <section class="card log-card" aria-label="Log an entry">
    <div class="level-readout">
      <output id="level-value" for="level">5.0</output>
    </div>
    <input type="range" id="level" min="1" max="10" step="0.1" value="5" aria-label="Tweak level from 1 to 10">
    <div class="scale-ends" aria-hidden="true"><span>1</span><span>10</span></div>
    <div class="note-row">
      <input type="text" id="note" maxlength="200" placeholder="note (optional)" autocomplete="off" aria-label="Optional note">
      <button id="photo-btn" class="icon-btn pic-btn" type="button" aria-label="Take a selfie for this entry">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
    </div>
    <input type="file" id="photo-input" accept="image/*" capture="user" hidden>
    <div id="photo-preview" class="photo-preview" hidden>
      <img id="photo-thumb" alt="Photo preview">
      <button id="photo-remove" class="ghost small" type="button">Remove</button>
    </div>
    <button id="log-btn" class="primary" type="button">Log</button>
  </section>

  <section id="history" hidden>
    <h2>Trend</h2>
    <div class="card chart-card"><div id="chart"></div></div>
    <h2>Entries</h2>
    <ul id="entries" class="entries"></ul>
  </section>

  <p id="empty" class="empty">No entries yet.</p>

  <footer>Your log never leaves this device.</footer>
</main>
<div id="lightbox" class="lightbox" hidden><img id="lightbox-img" alt="Entry photo"></div>
<script src="app.js"></script>
</body>
</html>
